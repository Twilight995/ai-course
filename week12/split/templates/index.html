<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
            -webkit-appearance: none;
        }
        input:focus {
            border-color: #007AFF;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background-color: #0056b3;
        }
        .result-area {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            background-color: #eef7ff;
            border-radius: 10px;
        }
        .result-text {
            font-size: 28px;
            font-weight: bold;
            color: #007AFF;
        }
        .error-text {
            color: #ff3b30;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💸 나눠 내기</h1>
        <form method="POST">
            <div class="form-group">
                <label for="amount">총 금액 (원)</label>
                <input type="number" id="amount" name="amount" inputmode="numeric" placeholder="예: 50000" required>
            </div>
            <div class="form-group">
                <label for="people">인원수 (명)</label>
                <input type="number" id="people" name="people" inputmode="numeric" placeholder="예: 4" required>
            </div>
            <button type="submit">계산하기</button>
        </form>

        {% if result %}
        <div class="result-area">
            <div style="color: #666; margin-bottom: 5px;">1인당 금액</div>
            <div class="result-text">{{ result }}</div>
        </div>
        {% endif %}

        {% if error %}
        <div class="error-text">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
