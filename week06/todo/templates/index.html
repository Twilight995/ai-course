<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <h1>할 일 목록</h1>
    
    <form action="/add" method="post">
        <input type="text" name="title" placeholder="할 일을 입력하세요" required>
        <button type="submit">추가</button>
    </form>

    <ul>
        {% for todo in todos %}
            <li>
                {{ todo.title }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
